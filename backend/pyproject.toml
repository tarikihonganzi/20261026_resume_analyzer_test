[project]
name = "resume-matching-backend"
version = "0.1.0"
description = "職歴書マッチング評価アプリのバックエンド"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "markitdown[docx,pptx,xls,xlsx]>=0.1.9",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.9",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "reportlab>=5.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
# 日本語の文字列・コメント・docstring で、全角の括弧や句読点を使うため
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# description は仕様書 5.4 章の文言をそのまま写す。折り返すと仕様書と見比べにくくなる
"src/app/llm/schemas.py" = ["E501"]
# システム指示は、1 行 1 項目の文章。折り返すと、LLM に渡す文面が変わる
"src/app/llm/prompts.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
# tests/fixtures を `fixtures` パッケージとして import できるようにする（pytest も tests/ を探索パスに加える）
extraPaths = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 実 API のテストは、依頼があったときだけ `-m live` で実行する
addopts = "-m 'not live'"
markers = ["live: 実 API を呼ぶテスト（費用がかかる。通常は実行しない）"]

[tool.uv]
# キャッシュとプロジェクトが別ドライブでも、ハードリンクの警告が出ないようにする
link-mode = "copy"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_also = [
    # `python -m` で動かすときの入口だけ（中身は main() のテストで確かめている）
    'if __name__ == "__main__":',
]
